name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate OpenAPI specs
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator api/app-api.yaml
          openapi-spec-validator api/agent-api.yaml

  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy chain_agent
      - name: Tests
        run: pytest -v
      - name: Build wheel
        if: matrix.python == '3.12'
        run: pip wheel --no-deps -w dist .
      - uses: actions/upload-artifact@v5
        if: matrix.python == '3.12'
        with:
          name: chain-agent-wheel
          path: agent/dist/*.whl

  libchainapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qthttpserver qtwebsockets'
          cache: true
      - name: Build libchainapp + example
        run: |
          cmake -S libchainapp -B build/libchainapp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/libchainapp --parallel
      - uses: actions/upload-artifact@v5
        with:
          name: example-app
          path: build/libchainapp/example-app
