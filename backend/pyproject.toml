[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmu-backend"
version = "0.1.0"
description = "CMU – centrální backend: řetězce aplikací z agentů a Komoda, integrace Zabbix a Prometheus"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
# e2e testy se skutečným agentem navíc potřebují: pip install ../agent
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "playwright>=1.45"]

[project.scripts]
cmu-backend = "cmu_backend.cli:main"

[tool.setuptools.packages.find]
include = ["cmu_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
